name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifest-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: manifest.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"

      - name: schema is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('docs/manifest.schema.json','utf8'))"

      - name: skill whitelist shape (manifest + example)
        run: |
          node -e '
            const checkInclude = (label, list) => {
              const bad = list.filter(s => !s.name || !s.root || !s.path);
              if (bad.length) { console.error(label + ": incomplete include entry", bad); process.exit(1); }
            };
            const checkExclude = (label, list) => {
              const bad = list.filter(s => !s.name || !s.reason || s.reason.length < 10);
              if (bad.length) { console.error(label + ": exclusion without a reason", bad.map(s => s.name)); process.exit(1); }
            };
            const m = require("./manifest.json");
            const ex = require("./skills.example.json");
            checkInclude("manifest", m.skills.include);
            checkInclude("example", ex.include);
            checkExclude("example", ex.exclude);
            console.log("manifest: " + m.skills.include.length + " skills; example: " + ex.include.length + " included, " + ex.exclude.length + " excluded");
          '

      - name: shell syntax
        run: |
          for f in scripts/*.sh start.sh; do bash -n "$f" && echo "ok $f"; done

      - name: no secrets tracked
        run: |
          ! git ls-files | grep -qiE '(^|/)(auth\.json|env\.sh|env\.bat|\.credentials\.json)$' \
            || { echo "a secret file is tracked"; exit 1; }
          echo "no secret files tracked"

      - name: base ships no third-party skills or extensions
        run: |
          if git ls-files --error-unmatch skills.local.json >/dev/null 2>&1; then
            echo "skills.local.json must never be tracked: it is the owner's private drive profile"; exit 1
          fi
          node -e '
            const fs = require("fs");
            const s = JSON.parse(fs.readFileSync("config/pi/settings.json", "utf8"));
            if (Array.isArray(s.packages) && s.packages.length) {
              console.error("config/pi/settings.json declares packages: the base must stay pi-only"); process.exit(1);
            }
            for (const p of ["config/pi/packages", "config/pi/skills", "config/pi/extensions"]) {
              if (fs.existsSync(p) && fs.readdirSync(p).length) {
                console.error(p + " is not empty: third-party resources are drive-profile only"); process.exit(1);
              }
            }
            const ex = require("./skills.example.json");
            const bad = (ex.packages || []).filter(p => !p.name || !p.spec || !p.reason || p.reason.length < 10);
            if (bad.length) { console.error("example package entry incomplete", bad); process.exit(1); }
            console.log("base repo: no third-party skills/extensions (profile-only)");
          '

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: parse PowerShell scripts
        shell: pwsh
        run: |
          $errs = @()
          foreach ($f in @('scripts/build.ps1', 'scripts/update.ps1', 'scripts/verify.ps1')) {
            $tokens = $null; $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { $errs += $parseErrors; Write-Host "FAIL $f" } else { Write-Host "ok $f" }
          }
          if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Host $_ }; exit 1 }
